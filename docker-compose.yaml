version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_app
    environment:
      DB_HOST: mysql-container
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: hris
    ports:
      - "8000:8000"
    restart: on-failure
    volumes:
      - .:/app
    networks:
      - mysql_database_network

networks:
  mysql_database_network:
    external: true



